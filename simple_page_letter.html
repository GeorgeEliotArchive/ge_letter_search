<div class="container">
<p>Here on the George Eliot Letters page, researchers can search the contents of Eliot's correspondence.</p>
<form id="searchForm" class="form-inline">
<div class="form-group"><label for="searchTerm"> <strong>Search Term:</strong> </label> <input type="text" class="form-control" id="searchTerm" name="searchTerm" placeholder="Enter search term" required="" /> <label for="searchField" style="margin-left: 10px;"> <strong>Search In:</strong> </label><select id="searchField" class="form-control">
<option value="all">All Fields</option>
<option value="text">Letter Text</option>
<option value="sender">Sender</option>
<option value="recipient">Recipient</option>
<option value="date">Date</option>
<option value="title">Title</option>
</select><button type="submit" class="btn btn-primary"> Search </button></div>
</form>
<div class="form-group" style="text-align: left;"><label> <br /><strong>Order by Date:</strong> </label> <button type="button" id="orderByDateAsc" class="btn btn-secondary"> Ascending </button> <button type="button" id="orderByDateDesc" class="btn btn-secondary"> Descending </button></div>
<div class="form-group" style="text-align: left;"><label> <br /><strong>Order by Sender:</strong> </label> <button type="button" id="orderBySenderAsc" class="btn btn-secondary"> A–Z </button> <button type="button" id="orderBySenderDesc" class="btn btn-secondary"> Z–A </button></div>
<p id="resultCount"></p>
<table class="table table-striped" style="border-style: groove; border-color: black; background-color: bisque; table-layout: fixed; width: 100%;"><colgroup> <col width="110px" /> <col width="140px" /> <col width="140px" /> <col width="160px" /> <col width="120px" /> <col /> </colgroup>
<thead>
<tr>
<th>Date</th>
<th>Sender</th>
<th>Recipient</th>
<th>Title</th>
<th>Place</th>
<th>Letter Text</th>
</tr>
</thead>
<tbody id="data"></tbody>
</table>
</div>
<p>
<script>

document.addEventListener("DOMContentLoaded", function () {

  const form =
    document.getElementById("searchForm");

  const searchInput =
    document.getElementById("searchTerm");

  const searchField =
    document.getElementById("searchField");

  const resultCount =
    document.getElementById("resultCount");

  const dataBody =
    document.getElementById("data");


  let currentResults = [];


  function safeText(value) {

    return value == null
      ? ""
      : String(value);

  }


  function renderRows(rows) {

    dataBody.innerHTML = "";


    rows.forEach(function (row) {

      const tr =
        document.createElement("tr");


      /*
       * Date
       */

      const tdDate =
        document.createElement("td");

      tdDate.textContent =
        safeText(row.date);


      /*
       * Sender
       */

      const tdSender =
        document.createElement("td");

      tdSender.textContent =
        safeText(row.sender);


      /*
       * Recipient
       */

      const tdRecipient =
        document.createElement("td");

      tdRecipient.textContent =
        safeText(row.recipient);


      /*
       * Title
       */

      const tdTitle =
        document.createElement("td");

      tdTitle.textContent =
        safeText(row.title);


      /*
       * Place
       */

      const tdPlace =
        document.createElement("td");

      tdPlace.textContent =
        safeText(row.place);


      /*
       * Letter text
       */

      const tdText =
        document.createElement("td");


      const snippetSpan =
        document.createElement("span");

      snippetSpan.textContent =
        safeText(row.snippet);

      tdText.appendChild(snippetSpan);


      /*
       * Show full letter
       */

      if (row.full_text) {

        const expandLink =
          document.createElement("a");

        expandLink.href = "#";

        expandLink.className =
          "expand-toggle";

        expandLink.textContent =
          " [show full letter]";


        expandLink.addEventListener(
          "click",
          function (e) {

            e.preventDefault();

            const isExpanded =
              tdText.classList.toggle(
                "expanded"
              );


            if (isExpanded) {

              snippetSpan.textContent =
                safeText(row.full_text);

              expandLink.textContent =
                " [show less]";

            }

            else {

              snippetSpan.textContent =
                safeText(row.snippet);

              expandLink.textContent =
                " [show full letter]";

            }

          }
        );


        tdText.appendChild(
          expandLink
        );

      }


      /*
       * Source
       */

      if (row.source) {

        const source =
          document.createElement("span");

        source.className =
          "letter-source";

        source.textContent =
          "Source: " +
          safeText(row.source);

        tdText.appendChild(source);

      }


      /*
       * Link to Omeka item
       */

      if (row.item_url) {

        const itemLink =
          document.createElement("a");

        itemLink.href =
          safeText(row.item_url);

        itemLink.target =
          "_blank";

        itemLink.rel =
          "noopener noreferrer";

        itemLink.className =
          "letter-item-link";

        itemLink.textContent =
          "View item";

        tdText.appendChild(
          document.createElement("br")
        );

        tdText.appendChild(
          itemLink
        );

      }


      tr.appendChild(tdDate);
      tr.appendChild(tdSender);
      tr.appendChild(tdRecipient);
      tr.appendChild(tdTitle);
      tr.appendChild(tdPlace);
      tr.appendChild(tdText);

      dataBody.appendChild(tr);

    });

  }


  /*
   * Date sorting
   */

  function dateValue(value) {

    const cleaned =
      String(value || "")
        .replace(/[^\d-]/g, "");

    return cleaned ||
      "9999-99-99";

  }


  /*
   * Search
   */

  form.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      const searchTerm =
        searchInput.value.trim();

      const field =
        searchField.value;


      if (searchTerm.length < 2) {

        alert(
          "Please enter at least 2 characters to search."
        );

        return;

      }


      resultCount.textContent =
        "Searching...";

      dataBody.innerHTML = "";

      currentResults = [];


      try {

        const url =
          "/letter_search.php?q=" +
          encodeURIComponent(searchTerm) +
          "&field=" +
          encodeURIComponent(field);


        const response = await fetch(url, {
            method: "GET",
            headers: {
              "Accept": "application/json"
            }
          });
        const rawText = await response.text();

        console.log("Server response:", rawText);

        let payload;

        try {
          payload = JSON.parse(rawText);
        } catch (e) {
          throw new Error(
            "Server did not return JSON. HTTP status: " +
            response.status +
            ". Response: " +
            rawText.substring(0, 200)
          );
        }

        if (!response.ok) {
          throw new Error(
            payload.error || "Search failed."
          );
        }


        currentResults =
          Array.isArray(
            payload.results
          )
            ? payload.results
            : [];


        renderRows(
          currentResults
        );


        let msg =
          `${payload.count} results found.`;


        if (payload.limited) {

          msg +=
            " Showing limited results only. Please refine your search.";

        }


        resultCount.textContent =
          msg;

      }

      catch (error) {

        console.error(error);

        resultCount.textContent =
          "Error loading results. Please try again.";

      }

    }
  );


  /*
   * Date ascending
   */

  document
    .getElementById(
      "orderByDateAsc"
    )
    .addEventListener(
      "click",
      function () {

        currentResults.sort(
          function (a,b) {

            return dateValue(a.date)
              .localeCompare(
                dateValue(b.date)
              );

          }
        );

        renderRows(
          currentResults
        );

      }
    );


  /*
   * Date descending
   */

  document
    .getElementById(
      "orderByDateDesc"
    )
    .addEventListener(
      "click",
      function () {

        currentResults.sort(
          function (a,b) {

            return dateValue(b.date)
              .localeCompare(
                dateValue(a.date)
              );

          }
        );

        renderRows(
          currentResults
        );

      }
    );


  /*
   * Sender A-Z
   */

  document
    .getElementById(
      "orderBySenderAsc"
    )
    .addEventListener(
      "click",
      function () {

        currentResults.sort(
          function (a,b) {

            return safeText(a.sender)
              .localeCompare(
                safeText(b.sender),
                undefined,
                {
                  sensitivity:"base"
                }
              );

          }
        );

        renderRows(
          currentResults
        );

      }
    );


  /*
   * Sender Z-A
   */

  document
    .getElementById(
      "orderBySenderDesc"
    )
    .addEventListener(
      "click",
      function () {

        currentResults.sort(
          function (a,b) {

            return safeText(b.sender)
              .localeCompare(
                safeText(a.sender),
                undefined,
                {
                  sensitivity:"base"
                }
              );

          }
        );

        renderRows(
          currentResults
        );

      }
    );

});

</script>
</p>
